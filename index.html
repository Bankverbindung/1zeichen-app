<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Tool</title><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>body{font-family:-apple-system,sans-serif;background:#0d0d0d;color:#eee;text-align:center;padding:20px}h1{font-size:1.1em;color:#7fd}.braille{font-size:4em;margin:20px 0;letter-spacing:.2em;user-select:all}input,select,button{font-size:1.1em;padding:10px;margin:6px;border-radius:8px;border:none}input[type=number]{width:70px;text-align:center}button{background:#2b8;color:#fff;cursor:pointer}button.secondary{background:#444}#decodeOut{font-size:1.3em;margin-top:10px;color:#ffb}.row{margin:10px 0}small{color:#888}#copyToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b8;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .25s ease;pointer-events:none;font-size:.9em}#copyToast.show{opacity:1}#pinOverlay{position:fixed;inset:0;background:#0d0d0dee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10}#pinOverlay input{width:140px}</style></head><body>
<div id="pinOverlay"><h1>Gerät entsperren</h1><input type="password" id="devicePin" placeholder="Geräte-PIN" autocomplete="off"><button onclick="unlock()">Entsperren</button><small id="pinHint"></small></div>
<h1>Ein-Zeichen Code</h1>
<div class="row"><b>Codieren</b><br>Stunde: <input type="number" id="h" min="0" max="23" value="17"> Viertel: <select id="m"><option>0</option><option>1</option><option>2</option><option>3</option></select> Status: <select id="s"><option value="1">kann</option><option value="0">kann nicht</option></select><br>Passphrase (geteiltes Geheimnis): <input type="text" id="key" value="motorrad" style="width:140px;"><button class="secondary" onclick="savePassphrase()">Passphrase merken</button><br><button onclick="encode()">Erzeugen</button></div>
<div class="braille" id="out">⠀</div>
<button class="secondary" onclick="copyChar()">In Zwischenablage kopieren</button>
<small id="hint"></small>
<hr>
<div class="row"><b>Decodieren</b><br>Zeichen einfügen: <input type="text" id="inChar" style="width:60px;font-size:1.5em;"><button onclick="decode()">Entschlüsseln</button></div>
<div id="decodeOut"></div>
<div id="copyToast">Kopiert</div>
<script>
let deviceKey=null;
async function deriveKey(pin){const enc=new TextEncoder();const salt=enc.encode('1zeichen-static-salt-v1');const baseKey=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function unlock(){const pin=document.getElementById('devicePin').value;if(!pin){document.getElementById('pinHint').textContent='Bitte PIN eingeben.';return;}deviceKey=await deriveKey(pin);const stored=localStorage.getItem('encPassphrase');if(stored){try{const decrypted=await decryptStored(stored);document.getElementById('key').value=decrypted;}catch(e){document.getElementById('pinHint').textContent='Falsche PIN oder kein Zugriff auf gespeicherte Passphrase.';return;}}document.getElementById('pinOverlay').style.display='none';encode();}
async function encryptForStorage(plain){const iv=crypto.getRandomValues(new Uint8Array(12));const enc=new TextEncoder();const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},deviceKey,enc.encode(plain));const combined=new Uint8Array(iv.length+ciphertext.byteLength);combined.set(iv,0);combined.set(new Uint8Array(ciphertext),iv.length);return btoa(String.fromCharCode(...combined));}
async function decryptStored(b64){const combined=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const iv=combined.slice(0,12);const ciphertext=combined.slice(12);const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},deviceKey,ciphertext);return new TextDecoder().decode(dec);}
async function savePassphrase(){if(!deviceKey){alert('Erst mit Geräte-PIN entsperren.');return;}const val=document.getElementById('key').value;const enc=await encryptForStorage(val);localStorage.setItem('encPassphrase',enc);showToast('Passphrase verschlüsselt gespeichert');}
function dayKey(passphrase){const d=new Date();const dayNum=Math.floor(d.getTime()/86400000);let hash=dayNum;for(let i=0;i<passphrase.length;i++){hash=(hash*31+passphrase.charCodeAt(i))%256;}return hash&0xFF;}
function encode(){const h=parseInt(document.getElementById('h').value)%24;const m=parseInt(document.getElementById('m').value)%4;const s=parseInt(document.getElementById('s').value)%2;const key=document.getElementById('key').value;const n=(h*8+m*2+s)&0xFF;const k=dayKey(key);const c=n^k;const code=0x2800+c;const char=String.fromCodePoint(code);document.getElementById('out').textContent=char;document.getElementById('hint').textContent="Heutiger Schlüssel: "+k+" (ändert sich morgen automatisch)";copyToClipboard(char,true);}
function decode(){const ch=document.getElementById('inChar').value.trim();const key=document.getElementById('key').value;if(!ch){return;}const code=ch.codePointAt(0);const c=code-0x2800;const k=dayKey(key);const n=c^k;const h=Math.floor(n/8);const m=Math.floor((n%8)/2);const s=n%2;document.getElementById('decodeOut').textContent="Uhrzeit: "+h+":"+(m*15).toString().padStart(2,'0')+" | Status: "+(s===1?"kann":"kann nicht");}
function copyChar(){const char=document.getElementById('out').textContent;copyToClipboard(char,true);}
function copyToClipboard(text,silent){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('Kopiert')).catch(()=>fallbackCopy(text));}else{fallbackCopy(text);}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');showToast('Kopiert');}catch(e){}document.body.removeChild(ta);}
function showToast(msg){const t=document.getElementById('copyToast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200);}
</script></body></html>
