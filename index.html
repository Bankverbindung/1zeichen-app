<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Tool</title><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>body{font-family:-apple-system,sans-serif;background:#0d0d0d;color:#eee;text-align:center;padding:20px}h1{font-size:1.1em;color:#7fd}.braille{font-size:4em;margin:20px 0;letter-spacing:.2em;user-select:all}input,select,button{font-size:1.1em;padding:10px;margin:6px;border-radius:8px;border:none}input[type=number]{width:70px;text-align:center}button{background:#2b8;color:#fff;cursor:pointer}#decodeOut{font-size:1.3em;margin-top:10px;color:#ffb}.row{margin:10px 0}.hint{background:#222;border:2px solid #2b8;border-radius:10px;padding:14px 18px;margin:14px auto;max-width:340px;font-size:1.15em;font-weight:bold;color:#9f9}#copyToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b8;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .25s ease;pointer-events:none;font-size:.9em}#copyToast.show{opacity:1}</style></head><body>
<h1>Ein-Zeichen Code</h1>
<div class="row"><b>Codieren</b><br>Stunde: <input type="number" id="h" min="0" max="23" value="17"> Viertel: <select id="m"><option>0</option><option>1</option><option>2</option><option>3</option></select> Status: <select id="s"><option value="1">kann</option><option value="0">kann nicht</option></select><br>Passphrase: <input type="text" id="key" value="" placeholder="Passphrase eingeben" style="width:160px;"><br><button onclick="encode()">Erzeugen</button></div>
<div class="braille" id="out">⠀</div>
<div class="hint" id="hint">Zeichen erzeugen, um den heutigen Schlüssel zu sehen.</div>
<hr>
<div class="row"><b>Decodieren</b><br>Zeichen einfügen: <input type="text" id="inChar" style="width:60px;font-size:1.5em;"><button onclick="decode()">Entschlüsseln</button></div>
<div class="hint" id="decodeOut">Noch kein Zeichen entschlüsselt.</div>
<div id="copyToast">Kopiert</div>
<script>
function dayKey(passphrase){const d=new Date();const dayNum=Math.floor(d.getTime()/86400000);let hash=dayNum;for(let i=0;i<passphrase.length;i++){hash=(hash*31+passphrase.charCodeAt(i))%256;}return hash&0xFF;}
function loadSavedPassphrase(){const saved=localStorage.getItem('passphrase');if(saved){document.getElementById('key').value=saved;}}
function encode(){const h=parseInt(document.getElementById('h').value)%24;const m=parseInt(document.getElementById('m').value)%4;const s=parseInt(document.getElementById('s').value)%2;const key=document.getElementById('key').value;localStorage.setItem('passphrase',key);const n=(h*8+m*2+s)&0xFF;const k=dayKey(key);const c=n^k;const code=0x2800+c;const char=String.fromCodePoint(code);document.getElementById('out').textContent=char;document.getElementById('hint').textContent="Heutiger Schlüssel: "+k+" — Zeichen wurde automatisch kopiert!";copyToClipboard(char);}
function decode(){const ch=document.getElementById('inChar').value.trim();const key=document.getElementById('key').value;if(!ch){return;}const code=ch.codePointAt(0);const c=code-0x2800;const k=dayKey(key);const n=c^k;const h=Math.floor(n/8);const m=Math.floor((n%8)/2);const s=n%2;document.getElementById('decodeOut').textContent="Uhrzeit: "+h+":"+(m*15).toString().padStart(2,'0')+" | Status: "+(s===1?"kann":"kann nicht");}
function copyToClipboard(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('Kopiert')).catch(()=>fallbackCopy(text));}else{fallbackCopy(text);}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');showToast('Kopiert');}catch(e){}document.body.removeChild(ta);}
function showToast(msg){const t=document.getElementById('copyToast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200);}
loadSavedPassphrase();
</script></body></html>
